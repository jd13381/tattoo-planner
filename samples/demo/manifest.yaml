# Asset catalogue of the sample project. The images are simple placeholder motifs that the planner
# draws itself (src/sample/placeholders.ts): no image file is shipped, and none of them is real tattoo
# art. "Save as new project" writes them as PNG files into the new project's images/ folder.
version: 1
assets:
