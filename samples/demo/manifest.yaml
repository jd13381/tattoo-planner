# Asset catalogue of the sample project. The images are simple placeholder motifs that the planner
# draws itself (src/sample/placeholders.ts): no image file is shipped, and none of them is real tattoo
# art. "Save as new project" writes them as PNG files into the new project's images/ folder.
# The exception are the five photos in photos/: Jan's real Anubis tattoo, cropped to the forearm, which
# Sam's existing-tattoo projection is built from (docs/adr/0029). They ship as JPEG files.
version: 1
assets:
  - id: compass
    file: images/compass.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Compass rose; stands in for a reference image.
    tags: [placeholder, geometric]
  - id: moon
    file: images/moon.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Crescent moon with three small stars.
    tags: [placeholder, sky]
  - id: wave
    file: images/wave.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Wave lines in a frame.
    tags: [placeholder, water]
  - id: fern
    file: images/fern.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Fern frond, tall and narrow.
    tags: [placeholder, botanical]
  - id: mandala
    file: images/mandala.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Mandala of rings, petals and dots.
    tags: [placeholder, geometric]
  - id: mountains
    file: images/mountains.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Mountain range in a circle.
    tags: [placeholder, landscape]
  - id: sun
    file: images/sun.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Sun with long and short rays.
    tags: [placeholder, sky]
  - id: swallow
    file: images/swallow.png
    kind: reference
    source: placeholder drawn by the planner
    notes: Swallow in flight.
    tags: [placeholder, animal]
  - id: anubis-1
    file: photos/anubis-1.jpg
    kind: existing
    source: Jan's own Anubis tattoo (photo by the author, shared for the sample)
    notes: Palm up, arm lying sideways; the reference view.
    tags: [anubis, existing, photo]
  - id: anubis-2
    file: photos/anubis-2.jpg
    kind: existing
    source: Jan's own Anubis tattoo (photo by the author, shared for the sample)
    notes: Arm upright, palm up, wrist turned a little towards medial.
    tags: [anubis, existing, photo]
  - id: anubis-3
    file: photos/anubis-3.jpg
    kind: existing
    source: Jan's own Anubis tattoo (photo by the author, shared for the sample)
    notes: Forearm turned towards the thumb, the lateral side.
    tags: [anubis, existing, photo]
  - id: anubis-4
    file: photos/anubis-4.jpg
    kind: existing
