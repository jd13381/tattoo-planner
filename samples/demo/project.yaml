# Sample project of the Tattoo Planner (docs/adr/0012-project-folder.md, "Sample project").
# It opens read-only; "Save as new project" in Settings → Project copies it into a folder you choose.
# body: the sample body the project starts from (female | male); height_cm is optional.
version: 1
name: Sample project
body: female
# Two people in one project (docs/adr/0017-persons.md): Alice's data is the top-level folders, Sam's
# lives in persons/sam/. Each has own layouts and measurements; the images are shared.
persons:
  - id: me
    name: Alice
  - id: sam
    name: Sam
    body: male
    height_cm: 186
