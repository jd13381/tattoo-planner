# Sam's existing tattoo: the Anubis on the inner left forearm, projected onto the arm from five photos
# (docs/adr/0014-guided-projection.md). The tattoo and the photos are the author's own (docs/adr/0029);
# the calibration is the one fitted on the author's arm, with the photo points moved into the cropped photos.
#
# Photo points are 0..1 from the left/top edge of the photo as shown upright, after `turn`.
# u = around the arm (0 outer, 0.25 lateral, 0.5 inner, 0.75 medial), v = along it (0 wrist, 1 shoulder).
name: anubis
description: "Anubis, inner left forearm, combined from five photos"
# The area of skin the combined picture covers
patch:
  u: [0, 1] # lateral … medial
  v: [0, 0.65] # wrist to above the elbow on Sam's arm, enough for what the photos show
  px_per_cm: 20
  feather_cm: 0.5 # soft edge where the patch ends
blend:
  exponent: 4 # weight of a photo = cos(viewing angle)^exponent: the most frontal photo wins
  white_radius_cm: 1.5 # window for the local skin brightness (evens out exposure and shading)
  skin_level: 0.9 # brightness from which a pixel counts as bare skin (hides hair)
  ink_threshold: 0.03 # how much ink makes the footprint used by the blockout and the metrics
photos:
  - file: photos/anubis-1.jpg # palm up, arm lying sideways (shown turned, wrist down); the reference view (u_view fixed at 0.5)
    turn: 0
    # The forearm silhouette, each edge as a line through two points
    edges:
      left: [{ x: 0.1174, y: 0.1714 }, { x: 0.2791, y: 0.5714 }]
      right: [{ x: 0.6559, y: 0.1714 }, { x: 0.5647, y: 0.5714 }]
    # Points at a known distance from the wrist crease along the arm, cm
    along:
      - { x: 0.3824, y: 0.61, cm: 0 } # wrist crease (marker line)
      - { x: 0.2059, y: 0.0786, cm: 28 } # tip of the ears (top of the tattoo)
    u_view: { wrist: 0.5, elbow: 0.5 } # u facing the camera; differs along the arm when the forearm is turned

  - file: photos/anubis-2.jpg # arm upright, palm up; the wrist end turned a little towards medial
    turn: 0
    # The forearm silhouette, each edge as a line through two points
    edges:
      left: [{ x: 0.2271, y: 0.1096 }, { x: 0.2848, y: 0.7945 }]
      right: [{ x: 0.6863, y: 0.1781 }, { x: 0.571, y: 0.7945 }]
    # Points at a known distance from the wrist crease along the arm, cm
    along:
      - { x: 0.4558, y: 0.8192, cm: 0.88 } # wrist marker line (0 cm), moved by the fit
      - { x: 0.3596, y: 0.1274, cm: 28.62 } # tip of the ears (top of the tattoo)
    u_view: { wrist: 0.67, elbow: 0.52 } # u facing the camera; differs along the arm when the forearm is turned

  - file: photos/anubis-3.jpg # forearm turned towards the thumb: shows the lateral side, wrist end turned most
    turn: 0
    # The forearm silhouette, each edge as a line through two points
    edges:
      left: [{ x: 0.3331, y: 0.1 }, { x: 0.2619, y: 0.6429 }]
      right: [{ x: 0.7412, y: 0.0714 }, { x: 0.5027, y: 0.7429 }]
    # Points at a known distance from the wrist crease along the arm, cm
    along:
      - { x: 0.3038, y: 0.7943, cm: 3.24 } # lowest visible ink; distance fitted to the other photos
      - { x: 0.3846, y: 0.1429, cm: 28.37 } # tip of the ears (top of the tattoo)
    u_view: { wrist: 0.29, elbow: 0.485 } # u facing the camera; differs along the arm when the forearm is turned

  - file: photos/anubis-4.jpg # forearm turned further: the ribbons on the lateral side face the camera
    turn: 0
    # The forearm silhouette, each edge as a line through two points
    edges:
      left: [{ x: 0.2896, y: 0.1 }, { x: 0.2716, y: 0.6429 }]
      right: [{ x: 0.703, y: 0.0714 }, { x: 0.515, y: 0.7429 }]
    # Points at a known distance from the wrist crease along the arm, cm
    along:
      - { x: 0.26, y: 0.7943, cm: 4.5 } # lowest visible ink; distance fitted to the other photos
      - { x: 0.3, y: 0.1857, cm: 28 } # tip of the ears (top of the tattoo)
    u_view: { wrist: 0.145, elbow: 0.39 } # u facing the camera; differs along the arm when the forearm is turned

  - file: photos/anubis-5.jpg # standing, arm hanging, palm towards the body: the thumb side (lateral) faces the camera, not medial
    turn: 0
    # Low weight: low resolution (about 18 px/cm on the arm) and every part it sees well is seen as well by
    # another photo, so at full weight it only blurs the patch. Raise it if a sharper copy replaces it.
    weight: 0.25
    # The forearm silhouette, each edge as a line through two points
    edges:
      left: [{ x: 0.2033, y: 0.1583 }, { x: 0.3767, y: 0.7333 }]
      right: [{ x: 0.5249, y: 0.1583 }, { x: 0.5404, y: 0.7333 }]
    # Points at a known distance from the wrist crease along the arm, cm
    along:
      - { x: 0.3911, y: 0.7033, cm: 3.49 } # lowest visible ink; distance fitted to the other photos
      - { x: 0.2356, y: 0.145, cm: 28.63 } # tip of the ears (top of the tattoo)
    u_view: { wrist: 0.35, elbow: 0.47 } # u facing the camera; differs along the arm when the forearm is turned
