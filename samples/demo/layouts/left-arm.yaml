# Sample layout on the left arm. u = around the arm (0 outer, 0.25 lateral, 0.5 inner, 0.75 medial),
# v = along it (0 wrist, 1 shoulder). Sizes in cm. Try moving, resizing or adding elements.
name: left-arm
region: arm-left
description: "Compass on the outer forearm, moon and stars on the inner upper arm, wave band at the wrist"
# Background layers lie under every element (bottom layer first); motifs on top cover them.
backgrounds:
  - id: stars
    source: { standard: stars }
    cover: area
    shapes:
      - { kind: span, u: [0.36, 0.64], v: [0.6, 0.9] }
    feather_cm: 1.5
    gap_cm: 0.3
elements:
  - id: compass
    type: figure
    asset: compass
    position: { u: 0.00, v: 0.28 } # outer forearm
    size_cm: { h: 10 }
  - id: moon
    type: figure
    asset: moon
    position: { u: 0.50, v: 0.74 } # inner upper arm
    size_cm: { h: 9 }
    red_accents: true
  - id: wrist-band
    type: band
    pattern: meander
    v: 0.03
    width_cm: 1.5
