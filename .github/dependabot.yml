# Dependabot (docs/adr/0027-ci-security-pipeline.md). The project is not maintained, so there are no
# routine version-update pull requests (open-pull-requests-limit: 0). Security updates still come:
# they are switched on in the repository settings (Code security → Dependabot security updates) and
# use the cooldown and groups below. The cooldown matches .npmrc's min-release-age of 7 days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
