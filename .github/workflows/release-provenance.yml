# Attaches the build provenance of a release's DMGs to the release as a file (docs/adr/0028-unsigned-dmg-release.md).
#
# The Desktop workflow signs a build provenance attestation for every DMG and GitHub stores it with
# the repository. Tools that only look at release files (OpenSSF Scorecard's Signed-Releases check,
# people without the gh CLI) cannot see that, so this workflow downloads the attestations, verifies
# them against this repository and uploads them as Tattoo-Planner-<version>.intoto.jsonl.
#
# Runs after each release (called by desktop.yml) and by hand for an existing tag.
name: Release provenance
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        type: string
        required: true
permissions:
  contents: read
jobs:
  provenance:
    name: Attach the provenance to the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the file to the release
      attestations: read # download the stored attestations
    steps:
      - name: Download, verify and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          mkdir dmg && cd dmg
          gh release download "$TAG" --pattern '*.dmg'
          out="Tattoo-Planner-${TAG#v}.intoto.jsonl"
          : > "../$out"
          for dmg in *.dmg; do
            gh attestation verify "$dmg" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/desktop.yml"
            gh attestation download "$dmg" --repo "$GH_REPO"
            cat sha256:*.jsonl >> "../$out"
            rm sha256:*.jsonl
          done
          cd ..
          wc -l "$out"
          gh release upload "$TAG" "$out" --clobber
