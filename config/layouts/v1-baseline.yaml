# Layout variant v1-baseline (PROJECT_BRIEF.md §13.2), copied as proposed in the brief.
# u = around the arm (0.5 = inner centre line, 0 = outer centre line), v = along the arm (0 = wrist, 1 = shoulder).
# Asset ids refer to the asset manifest (PROJECT_BRIEF.md §12.4); positions and sizes are Jan's to change.
name: v1-baseline
description: "Rhonas outer forearm, skull at elbow, Medusa upper arm, Pegasus inner upper arm"
elements:
  # Anubis from the photo arm-photos/anubis1_nr.JPG (manifest id anubis-photo, see README).
  # Size from measurements.yaml (26 × 12 cm). v = 0.203 puts its lowest point 2 cm above the wrist
  # crease: centre 2 + 26 / 2 = 15 cm of the 74 cm arm. crop, image_rotation_deg and feather_cm were
  # fitted by Claude on anubis1_nr.JPG (arm lies sideways, wrist on the right); adjust freely.
  - id: anubis
    type: existing
    asset: anubis-photo
    # Drawn from all four Anubis photos, wrapped round the arm where they put it (config/projections/anubis.yaml,
    # docs/adr/0006). position, size_cm, crop, image_rotation_deg and feather_cm below only apply while that
    # cannot be built (no data folder, photos missing): then the single photo above is shown in its box.
    projection: anubis
    locked: true
    position: { u: 0.50, v: 0.203 } # u = around (0.5 = inner centre line), v = along (0 = wrist)
    size_cm: { h: null, w: null }
    crop: { x: 0.229, y: 0.437, w: 0.361, h: 0.205 } # tight around the tattoo, in the photo as stored
    image_rotation_deg: 90 # clockwise: wrist down
    feather_cm: 0.3

  - id: rhonas
    type: figure
    asset: rhonas-card
    position: { u: 0.00, v: 0.18 } # outer centre line
    size_cm: { h: 22 }
    rotation_deg: 0
    style: hatching
    # Cut-out fitted by Claude: Rhonas with hood and staff out of the card art, without the temple on
    # the sides. The width follows from it (about 0.9 × height). Adjust or remove freely.
    crop: { x: 0.22, y: 0.112, w: 0.55, h: 0.443 }

  - id: skull
    type: figure
    asset: skull-ref-01
    position: { u: 0.85, v: 0.50 }
    size_cm: { h: 12 }
    style: realistic

  - id: medusa
    type: figure
    asset: medusa-ref-01
    position: { u: 0.10, v: 0.72 }
    size_cm: { h: 18 }
    style: realistic
    red_accents: true

  # Added at Jan's request (2026-11-03): inner upper arm, rising from Medusa (§3.2, §3.3).
  # Height and exact position are placeholders until Jan sets them.
  - id: pegasus
    type: figure
    asset: pegasus-ref-01
    position: { u: 0.50, v: 0.75 } # inner centre line, upper arm
    size_cm: { h: null }
    style: realistic

  - id: scales-forearm
    type: filler
    pattern: snake-scales
    region: { u: [ 0.25, 0.35 ], v: [ 0.05, 0.45 ] }
    density: 0.3

  - id: wrist-band
    type: band
    pattern: meander
    v: 0.02
    width_cm: 2

  - id: red-stroke-1
    type: line
    color: red
    points: [ { u: 0.05, v: 0.0 }, { u: 0.15, v: 0.4 }, { u: 0.10, v: 1.0 } ]
    width_cm: 1.5
