<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tattoo Planner</title>
    <!-- Sets the light or dark theme before the first paint (src/ui/theme.ts). -->
    <script src="/theme-init.js"></script>
    <!-- The splash: what the window shows until the project has loaded and React replaces the
         content of #root (src/main.tsx). Inline, so it paints before any module or stylesheet; the
         colours repeat --bg, --text and --red of both palettes in src/styles.css. -->
    <style>
      html {
        background: #0a0a0d;
      }
      html.light {
        background: #f3f3f6;
      }
      body {
        margin: 0;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: #e9e9ef;
        font:
          600 13px/1.4 "Inter Variable",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          "Segoe UI",
          sans-serif;
        letter-spacing: -0.01em;
        animation: splash-in 240ms ease-out 120ms both;
      }
      html.light .splash {
        color: #17171f;
      }
      .splash-mark {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background:
          linear-gradient(#d8262c, #d8262c) center / 4px 22px no-repeat,
          linear-gradient(135deg, #2a2a33, #18181e);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.16),
          0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .splash-bar {
        position: relative;
        width: 96px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      html.light .splash-bar {
        background: rgba(20, 20, 45, 0.12);
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 1px;
        background: currentColor;
        opacity: 0.7;
        animation: splash-run 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .splash-bar::after {
          animation: none;
        }
        .splash-bar::after {
          width: 100%;
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Tattoo Planner is loading">
        <span class="splash-mark" aria-hidden="true"></span>
        <span aria-hidden="true">Tattoo Planner</span>
        <span class="splash-bar" aria-hidden="true"></span>
      </div>
    </div>
    <noscript>Tattoo Planner needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
